name: Release

# main is only ever updated by merging develop (enforced by branch protection
# + branch-policy), so any push to main is a release. Tag it and publish a
# GitHub Release with auto-generated notes.
on:
  push:
    branches: [main]

permissions:
  contents: write        # create tags and releases
  pull-requests: write   # open the changelog-update PR into develop

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history + tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute next version
        id: ver
        run: |
          # Calendar versioning: YY.WW.patch, where YY/WW are the ISO week-date
          # (date +%g/%V handle the year-boundary correctly). The patch counter
          # resets each new ISO week and increments for multiple releases in one.
          git fetch --tags --force
          yw="$(date +%g).$(date +%V)"           # e.g. 26.33
          latest=$(git tag -l "${yw}.*" | sort -t. -k3 -n | tail -n1)
          if [ -z "$latest" ]; then
            patch=1                              # first release this ISO week starts at 01
          else
            patch=$(( 10#${latest##*.} + 1 ))    # 10# forces base-10 (so 08/09 don't fail)
          fi
          next="${yw}.$(printf '%02d' "$patch")" # zero-pad the patch to 2 digits -> 26.33.01
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Next release: $next (latest this week: ${latest:-none})"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          if git rev-parse "$NEXT" >/dev/null 2>&1; then
            echo "Tag $NEXT already exists; skipping."
            exit 0
          fi
          gh release create "$NEXT" \
            --target "${{ github.sha }}" \
            --title "$NEXT" \
            --generate-notes
          echo "Published release $NEXT"

      # The changelog PR must run under a real identity, because GitHub does NOT
      # trigger workflows (our required `test`/`branch-policy` checks) for events
      # made with the built-in GITHUB_TOKEN. A user/fine-grained PAT in the
      # RELEASE_PAT secret fixes that. Without it, we skip (the release still
      # succeeds); refresh the changelog manually via scripts/gen-changelog.sh.
      - name: Check for RELEASE_PAT
        id: pat
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -n "$RELEASE_PAT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_PAT not set — skipping automatic CHANGELOG update. Run scripts/gen-changelog.sh and include it in the next release PR."
          fi

      - name: Regenerate CHANGELOG and open PR into develop
        if: steps.pat.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          # main can't be pushed to directly, so the regenerated changelog goes
          # through the normal flow: a PR into develop that auto-merges once the
          # required checks pass (it reaches main on the next release). Using the
          # PAT for the push + PR makes those checks actually run.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin develop
          branch="chore/changelog-$NEXT-${{ github.run_id }}"
          git checkout -B "$branch" origin/develop
          # The releases API is eventually consistent, so poll until the just-
          # published $NEXT actually appears before trusting the generated file.
          for i in $(seq 1 10); do
            ./scripts/gen-changelog.sh "${{ github.repository }}"
            if grep -q "^## $NEXT " CHANGELOG.md; then break; fi
            echo "Release $NEXT not visible yet (attempt $i); retrying..."
            sleep 5
          done
          if ! grep -q "^## $NEXT " CHANGELOG.md; then
            echo "::error::Release $NEXT never appeared in the API; aborting."
            exit 1
          fi
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already current; nothing to do."
            exit 0
          fi
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG for $NEXT"
          git push origin "$branch"
          gh pr create --base develop --head "$branch" \
            --title "docs: update CHANGELOG for $NEXT" \
            --body "Automated changelog regeneration from release notes for $NEXT."
          gh pr merge "$branch" --auto --squash --delete-branch
