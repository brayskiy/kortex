name: Bug report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please include enough detail to reproduce it.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ./gradlew run --args="train char"
        2. ...
        3. See error
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS and JDK version (output of `java -version`)
      placeholder: "Ubuntu 24.04, OpenJDK 21.0.11"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant output / stack trace
      description: Paste any console output. This is rendered as code, so no backticks needed.
      render: shell
    validations:
      required: false
